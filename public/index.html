<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trade App Deep Link Tester</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1e9;
        --panel: rgba(255, 255, 255, 0.88);
        --text: #1d2329;
        --muted: #5f6b76;
        --accent: #0f766e;
        --accent-2: #134e4a;
        --border: rgba(29, 35, 41, 0.12);
        --shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.15), transparent 30%),
          radial-gradient(circle at top right, rgba(250, 204, 21, 0.12), transparent 26%),
          var(--bg);
        color: var(--text);
      }
      .shell {
        max-width: 1240px;
        margin: 0 auto;
        padding: 28px 20px 48px;
      }
      .hero {
        display: grid;
        gap: 18px;
        grid-template-columns: 1.3fr 1fr;
        align-items: start;
        margin-bottom: 22px;
      }
      .panel {
        background: var(--panel);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 22px;
      }
      h1, h2, h3, p, dl, dt, dd { margin: 0; }
      h1 {
        font-size: clamp(2rem, 4vw, 3.2rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
        margin-bottom: 10px;
      }
      .lede {
        color: var(--muted);
        line-height: 1.55;
        max-width: 68ch;
      }
      .layout {
        display: grid;
        gap: 16px;
        margin-top: 18px;
      }
      .builder {
        display: grid;
        gap: 14px;
      }
      .grid-2 {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .field {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .field input, .field select {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: white;
        font: inherit;
      }
      .param-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .button, .button-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 999px;
        padding: 12px 16px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .button {
        background: var(--accent);
        color: white;
      }
      .button:hover { background: var(--accent-2); }
      .button-secondary {
        background: white;
        color: var(--text);
        border-color: var(--border);
      }
      .button-secondary:hover { border-color: rgba(29, 35, 41, 0.24); }
      .meta {
        display: grid;
        gap: 12px;
      }
      .meta-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .meta-row:last-child { border-bottom: 0; }
      .label { color: var(--muted); font-size: 0.9rem; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.9em;
        padding: 0.15rem 0.35rem;
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.06);
        overflow-wrap: anywhere;
      }
      .section {
        margin-top: 26px;
      }
      .section h2 {
        font-size: 1.1rem;
        margin-bottom: 12px;
      }
      .reference-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      }
      .card {
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        display: grid;
        gap: 14px;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: start;
      }
      .card h3 { font-size: 1rem; margin-bottom: 4px; }
      .card p { color: var(--muted); line-height: 1.45; font-size: 0.93rem; }
      .card-body { display: grid; gap: 12px; }
      .mini-label {
        color: var(--muted);
        font-size: 0.82rem;
        margin-bottom: 6px;
      }
      .reference-list {
        display: grid;
        gap: 8px;
      }
      .reference-row {
        display: grid;
        gap: 4px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.12);
        color: var(--accent-2);
        padding: 6px 10px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .hint {
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }
      .preview-list {
        display: grid;
        gap: 10px;
      }
      .preview-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: start;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .preview-row:last-child { border-bottom: 0; }
      .launch {
        white-space: nowrap;
      }
      .footnote {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }
      @media (max-width: 920px) {
        .hero { grid-template-columns: 1fr; }
        .grid-2 { grid-template-columns: 1fr; }
        .preview-row, .card-head, .meta-row { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div id="app" class="panel">Loading...</div>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
